
name: Build and Deploy

on:
  push:
    branches:
      - main
      - integrate
      - 'feature/**'

  pull_request:
    branches:
      - main
      - integrate

permissions:
  contents: read
  pages: read

jobs:

  # Job 1: Build React application
  build:
    name: React Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build React Application
        run: npm run build

      # Configure GitHub Pages for push events
      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      # Upload build artifact
      - name: Upload Build Artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Job 2: Deploy React application
  deploy:
    name: Deploy React Application
    needs: build
    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    permissions:
      pages: write
      id-token: write
      contents: read

    # Select environment based on branch
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'integrate' && 'sit' || 'dev' }}
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
